<script>
/*!
 * Fall Kit · v1.0.0 · the shared cascade for every estate seed
 * MIT · Simon Gant · ai-nativesolutions.com · ◊·κ=1
 *
 * Inlineable JS module. Drop into any seed via <script> or copy-paste inline.
 * Preserves single-HTML sovereignty (no external deps until user opts in to T2 WebLLM).
 *
 * What it gives every seed:
 *  - AI tier picker: T0 (off · default) · T2 (WebLLM in-browser, 5 models 1B-70B) · T3 (BYOK Anthropic/OpenAI/Google)
 *  - Universal entry: FallKit.aiComplete(systemPrompt, userMsg, maxTokens) → string|null
 *  - AI chip UI in header
 *  - WebRTC P2P mesh (ported from canonical fallnet · fall-signal channel · Google STUN)
 *  - Help section partial: FallKit.helpSection()
 *  - Settings panel: FallKit.openSettings()
 *
 * Doctrine (per botler CLAUDE.md):
 *  - T0 fallback ALWAYS works · aiComplete returns null · caller MUST degrade gracefully
 *  - NEVER hide a feature behind AI · NEVER proxy API keys · NEVER log keys
 *  - WebLLM is lazy-loaded · model weights download ONLY on user opt-in
 *
 * Estate-first canonical references:
 *  - WebLLM pattern: Downloads/botler/index.html (T0/T2/T3 cascade)
 *  - WebRTC pattern: Downloads/fallnet/fallnet-shim.js (raw RTCPeerConnection)
 *  - Konomi seal:    ◊·κ=1  (consistent across all estate seeds)
 *  - Mesh channel:   'fall-signal'
 */
(function (root) {
  'use strict';

  const FALL_KIT_VERSION = '1.1.0';

  // ─── Model registry ──────────────────────────────────────────────
  const WEBLLM_MODELS = {
    'llama-1b':  { id: 'Llama-3.2-1B-Instruct-q4f16_1-MLC',   size: '~700MB', label: '1B · fast · any laptop / phone' },
    'llama-3b':  { id: 'Llama-3.2-3B-Instruct-q4f16_1-MLC',   size: '~2GB',   label: '3B · balanced · default · most laptops' },
    'qwen-7b':   { id: 'Qwen2.5-7B-Instruct-q4f16_1-MLC',     size: '~5GB',   label: '7B · capable · needs decent GPU (M-series Mac / 8GB+ VRAM)' },
    'llama-8b':  { id: 'Llama-3.1-8B-Instruct-q4f16_1-MLC',   size: '~5GB',   label: '8B · common · needs decent GPU' },
    'llama-70b': { id: 'Llama-3.1-70B-Instruct-q4f16_1-MLC',  size: '~40GB',  label: '70B · frontier · needs serious GPU + 64GB+ RAM' },
  };
  const DEFAULT_MODEL = 'llama-3b';

  const T3_PROVIDERS = {
    anthropic: { label: 'Anthropic Claude', models: ['claude-sonnet-4-5','claude-opus-4-7','claude-haiku-4-5'], default: 'claude-sonnet-4-5', url: 'https://api.anthropic.com/v1/messages' },
    openai:    { label: 'OpenAI',           models: ['gpt-4o','gpt-4o-mini','o1-mini'],                          default: 'gpt-4o-mini',      url: 'https://api.openai.com/v1/chat/completions' },
    google:    { label: 'Google Gemini',    models: ['gemini-1.5-pro','gemini-1.5-flash','gemini-2.0-flash-exp'], default: 'gemini-1.5-flash', url: 'https://generativelanguage.googleapis.com/v1beta/models/' },
  };

  // ─── State ───────────────────────────────────────────────────────
  const STATE = {
    config: loadConfig(),
    ai: { ready: false, loading: false, progress: 0, engine: null, model: null },
    mesh: { active: false, peers: new Map(), bc: null, signal: null },
  };

  function loadConfig() {
    try { return JSON.parse(localStorage.getItem('fall-kit.config') || '{}'); }
    catch (e) { return {}; }
  }
  function saveConfig() {
    try { localStorage.setItem('fall-kit.config', JSON.stringify(STATE.config)); } catch (e) {}
  }

  // ─── DOM helpers ─────────────────────────────────────────────────
  function $(s, root) { return (root || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  // ─── AI tier ─────────────────────────────────────────────────────
  function aiTier() { return STATE.config.ai_tier || 'T0'; }

  function renderAiChip() {
    const chip = $('#fk-ai-chip');
    if (!chip) return;
    const txt = $('#fk-ai-chip-text');
    chip.classList.remove('fk-chip-live', 'fk-chip-loading', 'fk-chip-warn');
    const tier = aiTier();
    if (tier === 'T0') { txt.textContent = 'T0 · off'; }
    else if (tier === 'T2') {
      if (STATE.ai.ready) { txt.textContent = 'T2 ' + (WEBLLM_MODELS[STATE.config.webllm_model || DEFAULT_MODEL]?.label.split(' · ')[0] || '') + ' · ready'; chip.classList.add('fk-chip-live'); }
      else if (STATE.ai.loading) { txt.textContent = 'T2 loading ' + Math.round(STATE.ai.progress) + '%'; chip.classList.add('fk-chip-loading'); }
      else { txt.textContent = 'T2 · click to load'; chip.classList.add('fk-chip-warn'); }
    } else if (tier === 'T3') {
      if (STATE.config.api_key) { txt.textContent = 'T3 ' + (T3_PROVIDERS[STATE.config.api_provider]?.label || 'BYOK') + ' · active'; chip.classList.add('fk-chip-live'); }
      else { txt.textContent = 'T3 · no key set'; chip.classList.add('fk-chip-warn'); }
    }
  }

  async function loadWebLLM(modelKey) {
    if (STATE.ai.loading) return;
    const key = modelKey || STATE.config.webllm_model || DEFAULT_MODEL;
    const model = WEBLLM_MODELS[key];
    if (!model) { console.error('fall-kit: unknown model', key); return; }
    if (STATE.ai.ready && STATE.ai.model === model.id) return;
    STATE.ai.loading = true; STATE.ai.progress = 0; renderAiChip();
    notify('Loading WebLLM · ' + model.label + ' · ' + model.size + ' first time', 'info');
    try {
      const { CreateMLCEngine } = await import('https://esm.run/@mlc-ai/web-llm@0.2.79');
      const engine = await CreateMLCEngine(model.id, {
        initProgressCallback: p => { STATE.ai.progress = (p.progress || 0) * 100; renderAiChip(); }
      });
      STATE.ai.engine = engine;
      STATE.ai.model = model.id;
      STATE.ai.ready = true;
      STATE.ai.loading = false;
      STATE.config.webllm_model = key; saveConfig();
      renderAiChip();
      notify('WebLLM ready · sovereign mode · ' + model.label.split(' · ')[0], 'ok');
    } catch (e) {
      console.error('fall-kit: WebLLM load failed', e);
      STATE.ai.loading = false; renderAiChip();
      notify('WebLLM load failed · ' + e.message, 'err');
    }
  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userMsg }],
        max_tokens: maxTokens,
      });
      return r.choices[0].message.content;
    }
    if (tier === 'T3' && STATE.config.api_key && STATE.config.api_provider) {
      return await aiCloudCall(systemPrompt, userMsg, maxTokens);
    }
    return null;
  }

  async function aiCloudCall(sys, msg, maxTokens) {
    const provider = STATE.config.api_provider;
    const key = STATE.config.api_key;
    const model = STATE.config.api_model || T3_PROVIDERS[provider]?.default;
    if (provider === 'anthropic') {
      const r = await fetch(T3_PROVIDERS.anthropic.url, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01' },
        body: JSON.stringify({ model, max_tokens: maxTokens, system: sys, messages: [{ role: 'user', content: msg }] }),
      });
      if (!r.ok) throw new Error('Anthropic ' + r.status + ': ' + (await r.text()).slice(0, 200));
      const j = await r.json();
      return j.content[0].text;
    }
    if (provider === 'openai') {
      const r = await fetch(T3_PROVIDERS.openai.url, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, max_tokens: maxTokens, messages: [{ role: 'system', content: sys }, { role: 'user', content: msg }] }),
      });
      if (!r.ok) throw new Error('OpenAI ' + r.status);
      const j = await r.json();
      return j.choices[0].message.content;
    }
    if (provider === 'google') {
      const r = await fetch(T3_PROVIDERS.google.url + model + ':generateContent?key=' + encodeURIComponent(key), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: sys + '\n\n---\n\n' + msg }] }], generationConfig: { maxOutputTokens: maxTokens } }),
      });
      if (!r.ok) throw new Error('Google ' + r.status);
      const j = await r.json();
      return j.candidates[0].content.parts[0].text;
    }
    throw new Error('unknown provider: ' + provider);
  }

  // ─── WebRTC P2P mesh (ported from canonical fallnet · fall-signal channel · Google STUN) ───
  const MESH_CHANNEL = 'fall-signal';
  const STUN_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];
  function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.bc.onmessage = e => {
      const m = e.data;
      if (!m || !m.kind || m.peerId === seedId) return;

function idbPut(store,val){return new Promise(r=>{const req=txStore(store,'readwrite').put(val);req.onsuccess=()=>r(true);req.onerror=()=>r(false)})}
function idbDel(store,key){return new Promise(r=>{const req=txStore(store,'readwrite').delete(key);req.onsuccess=()=>r(true)})}
function idbGetAll(store){return new Promise(r=>{const req=txStore(store).getAll();req.onsuccess=()=>r(req.result||[]);req.onerror=()=>r([])})}
function idbGet(store,key){return new Promise(r=>{const req=txStore(store).get(key);req.onsuccess=()=>r(req.result);req.onerror=()=>r(null)})}

async function appendAudit(action,reasoning,payload){
 if(!state.settings.auditChain)return;
 const prev=state.audit.length?state.audit[state.audit.length-1]:null;
 const prevHash=prev?prev.hash:'';
 const docStr=JSON.stringify(payload||{});
 const docHash=await sha256(docStr);
 const i=(prev?prev.i:0)+1;
 const ts=Date.now();
 const hash=await sha256(prevHash+docHash+ts+i);
 const entry={id:'au_'+i+'_'+ts,i,ts,tool:TOOLNAME,configVersion:TOOLNAME+'@'+VERSION,adviserId:'',clientId:payload?.clientId||'',action,reasoning:reasoning||'',prevHash,docHash,hash,payload:payload||{}};
 state.audit.push(entry);
 if(state.audit.length>5000)state.audit=state.audit.slice(-5000);
 await idbPut('audit',entry);
}

let chFallClaim=null, chFallSignal=null;
function setupMesh(){
 try{
 chFallClaim=new BroadcastChannel('fall-claim');
 chFallClaim.addEventListener('message',onFallClaimMsg);
 chFallClaim.postMessage({v:1,type:'sync.request',ts:now(),source:TOOLNAME,payload:{}});
 }catch(e){}
 try{
 chFallSignal=new BroadcastChannel('fall-signal');
 chFallSignal.postMessage({source:TOOLNAME,type:'hello',prime:PRIME,version:VERSION,ts:now()});
 chFallSignal.addEventListener('message',async e=>{
 const m=e.data;if(!m)return;
 if(m.type==='ping')chFallSignal.postMessage({source:TOOLNAME,type:'pong',prime:PRIME});
 if(m.source==='si-didy'&&m.type==='query'&&m.intent){const ans=await answerQuestion(m.intent);chFallSignal.postMessage({source:TOOLNAME,type:'answer',replyTo:m.id,text:ans.text})}
 });
 }catch(e){}
}
async function onFallClaimMsg(e){
 const m=e.data;if(!m||m.source===TOOLNAME)return;
 if(m.type==='sync.request'){
 chFallClaim.postMessage({v:1,type:'sync.snapshot',ts:now(),source:TOOLNAME,payload:{clients:state.clients,advisers:state.advisers,firm:state.firm,cases:state.cases}});
 return;
 }
 if(m.type==='sync.snapshot'){
 const p=m.payload||{};
 if(p.firm&&(!state.firm||(p.firm.updatedAt||0)>(state.firm.updatedAt||0))){state.firm=p.firm;await idbPut('firms',p.firm)}
 if(Array.isArray(p.clients))for(const c of p.clients){const ex=state.clients.find(x=>x.id===c.id);if(!ex||(c.updatedAt||0)>(ex.updatedAt||0)){if(ex)Object.assign(ex,c);else state.clients.push(c);await idbPut('clients',c)}}
 if(Array.isArray(p.advisers))for(const a of p.advisers){const ex=state.advisers.find(x=>x.id===a.id);if(!ex||(a.updatedAt||0)>(ex.updatedAt||0)){if(ex)Object.assign(ex,a);else state.advisers.push(a);await idbPut('advisers',a)}}
 if(Array.isArray(p.cases))for(const c of p.cases){const ex=state.cases.find(x=>x.id===c.id);if(!ex||(c.updatedAt||0)>(ex.updatedAt||0)){if(ex)Object.assign(ex,c);else state.cases.push(c);await idbPut('cases',c)}}
 render();return;
 }
 if(m.type==='client.created'||m.type==='client.updated'){
 const c=m.payload;if(!c||!c.id)return;
 const ex=state.clients.find(x=>x.id===c.id);
 if(ex)Object.assign(ex,c);else state.clients.push(c);
 await idbPut('clients',c);render();return;
 }
 if(m.type==='adviser.created'||m.type==='adviser.updated'){
 const a=m.payload;if(!a||!a.id)return;
 const ex=state.advisers.find(x=>x.id===a.id);
 if(ex)Object.assign(ex,a);else state.advisers.push(a);
 await idbPut('advisers',a);render();return;
 }
 if(m.type==='firm.updated'){
 if(m.payload){state.firm=m.payload;await idbPut('firms',m.payload);render()} return;
 }
 if(m.type==='case.created'||m.type==='case.updated'){
 const c=m.payload;if(!c||!c.id)return;
 const ex=state.cases.find(x=>x.id===c.id);
 if(ex)Object.assign(ex,c);else state.cases.push(c);
 await idbPut('cases',c);render();return;
 }
 if(m.type==='case.settled'){
 const c=m.payload;if(!c||!c.id)return;
 const ex=state.cases.find(x=>x.id===c.id);
 if(ex)Object.assign(ex,c);else state.cases.push(c);
 await idbPut('cases',c);
 await autoRealiseOnSettle(c);
 render();return;
 }
 if(m.type==='case.discontinued'){
 const c=m.payload;if(!c||!c.id)return;
 const ex=state.cases.find(x=>x.id===c.id);
 if(ex)Object.assign(ex,c);else state.cases.push(c);
 await idbPut('cases',c);
 await reverseAccrualsOnLost(c);
 render();return;
 }
}

async function autoRealiseOnSettle(cs){
 if(!cs||cs.outcome==='lost')return;
 const wip=state.feeRecords.filter(f=>f.caseId===cs.id&&f.status==='wip');
 const wipTotal=wip.reduce((a,f)=>a+(f.net||0),0);
 // Realise WIP
 for(const f of wip){f.status='realised';f.realisedAt=now();await idbPut('feeRecords',f)}
 // Calculate success fee
 let successFee=0;
 const cap=(cs.valuation?.totalEstimate||cs.settlementAmount||0)*RULES.cfaSuccessFeePiCapPct;
 if(cs.feeArrangement==='cfa'){
 successFee=Math.min(wipTotal*((cs.cfaSuccessFeePct||0)/100), cap);
 } else if(cs.feeArrangement==='dba'){
 const dbaCap=(cs.settlementAmount||cs.valuation?.totalEstimate||0)*((cs.dbaPct||0)/100);
 const courtCap=(cs.settlementAmount||cs.valuation?.totalEstimate||0)*RULES.dbaPiCapPct;
 successFee=Math.min(dbaCap,courtCap);
 }
 if(successFee>0){
 const fee={id:'fr_'+uid(),caseId:cs.id,clientId:cs.clientId,adviserId:cs.responsibleHandlerId,firmId:cs.firmId,ts:now(),dateOf:isoDate(now()),arrangement:cs.feeArrangement,type:'success-fee',basis:'%damages',hours:0,hourlyRate:0,description:`Success fee on case ${cs.ref} · ${cs.feeArrangement.toUpperCase()} · damages ${money(cs.settlementAmount||cs.valuation?.totalEstimate||0)}`,gross:Math.round(successFee),vat:0,net:Math.round(successFee),status:'invoiced',realisedAt:now(),allocations:[{adviserId:cs.responsibleHandlerId,share:1.0}],invoiceId:'INV-'+new Date().getFullYear()+'-'+(state.feeRecords.length+1).toString().padStart(4,'0')};
 state.feeRecords.push(fee);await idbPut('feeRecords',fee);
 }
 await appendAudit('case.settled.autoRealise','case.settled event auto-realised WIP + success fee',{caseId:cs.id,wipRealised:wipTotal,successFee});
 toast('case settled · '+wip.length+' WIP realised · success fee '+money(successFee));
}
async function reverseAccrualsOnLost(cs){
 if(!cs)return;
 const wip=state.feeRecords.filter(f=>f.caseId===cs.id&&f.status==='wip');
 for(const f of wip){f.status='written-off';await idbPut('feeRecords',f)}
 await appendAudit('case.lost.reverseAccruals','case.discontinued/lost · WIP written off',{caseId:cs.id,count:wip.length});
}

// ─── Analytics ───
function feesForCase(caseId){return state.feeRecords.filter(f=>f.caseId===caseId)}
function feesForClient(clientId){return state.feeRecords.filter(f=>f.clientId===clientId)}
function feesForAdviser(adviserId){
 return state.feeRecords.map(f=>{
 const alloc=(f.allocations||[]).find(a=>a.adviserId===adviserId);
 if(!alloc)return null;
 return {fee:f,share:alloc.share||0,attributable:(f.net||0)*(alloc.share||0)};
 }).filter(Boolean);
}
function totalFirmRevenue(opts){
 opts=opts||{};
 let total=0;
 for(const f of state.feeRecords){
 if(opts.received&&f.status!=='paid'&&f.status!=='realised')continue;
 if(opts.month&&monthKey(f.ts)!==opts.month)continue;
 if(opts.year&&new Date(f.ts).getFullYear()!==opts.year)continue;
 if(opts.realisedOnly&&f.status==='wip')continue;
 total+=(f.net||0);
 }
 return total;
}
function ytdFees(){const y=new Date().getFullYear();return totalFirmRevenue({year:y,realisedOnly:true})}
function mtdFees(){return totalFirmRevenue({month:monthKey(now()),realisedOnly:true})}
function wipTotal(){return state.feeRecords.filter(f=>f.status==='wip').reduce((a,f)=>a+(f.net||0),0)}
function feesByArrangement(){
 const m={cfa:0,dba:0,hourly:0,fixed:0,'legal-aid':0,disbursement:0};
 for(const f of state.feeRecords){if(f.status==='wip')continue;m[f.arrangement]=(m[f.arrangement]||0)+(f.net||0)}
 return m;
}
function feesByMonth(n){
 const map=new Map();
 const d=new Date();d.setDate(1);
 for(let i=n-1;i>=0;i--){const dd=new Date(d.getFullYear(),d.getMonth()-i,1);map.set(monthKey(dd),{cfa:0,dba:0,hourly:0,fixed:0,'legal-aid':0,disbursement:0,total:0})}
 for(const f of state.feeRecords){
 if(f.status==='wip')continue;
 const k=monthKey(f.ts);if(!map.has(k))continue;
 const e=map.get(k);if(e[f.arrangement]===undefined)e[f.arrangement]=0;
 e[f.arrangement]+=(f.net||0);e.total+=(f.net||0);
 }
 return [...map.entries()].map(([k,v])=>({month:k,...v}));
}
// Escrow
function escrowTotalHeld(){
 let total=0;
 for(const e of state.escrow){
 if(e.type==='in')total+=(e.amount||0);
 if(e.type==='out')total-=(e.amount||0);
 }
 return total;
}
function escrowForCase(caseId){return state.escrow.filter(e=>e.caseId===caseId)}
function escrowUnreconciled(){return state.escrow.filter(e=>e.type!=='reconciliation'&&!e.reconciledAt)}
function lastEscrowReconciliation(){const r=state.escrow.filter(e=>e.type==='reconciliation').sort((a,b)=>b.ts-a.ts);return r[0]||null}
function daysSinceEscrowReconciliation(){const l=lastEscrowReconciliation();return l?daysBetween(l.ts,now()):999}
// Success-fee accrual auto-compute
function liveAccrualForCase(cs){
 if(!cs||cs.status!=='active')return 0;
 const wip=feesForCase(cs.id).filter(f=>f.status==='wip'&&f.type==='time-recorded').reduce((a,f)=>a+(f.net||0),0);
 if(cs.feeArrangement==='cfa'){
 const cap=(cs.valuation?.totalEstimate||0)*RULES.cfaSuccessFeePiCapPct;
 return Math.min(wip*((cs.cfaSuccessFeePct||0)/100),cap);
 } else if(cs.feeArrangement==='dba'){
 const dam=cs.valuation?.totalEstimate||0;
 return Math.min(dam*((cs.dbaPct||0)/100),dam*RULES.dbaPiCapPct);
 }
 return 0;
}

function piiDaysToExpiry(){if(!state.firm?.piiExpiresAt)return null;return daysBetween(now(),state.firm.piiExpiresAt)}
function piiMonthlyAccrual(){return Math.round((state.settings.piiAnnualPremium||0)/12)}
function cmrMonthlyAccrual(){return Math.round((state.settings.cmrAnnualFee||0)/12)}
function nextCmrFeeDue(){
 const latest=state.fcaCmrFees.slice().sort((a,b)=>(b.year||0)-(a.year||0))[0];
 if(!latest||!latest.paidAt)return {next:isoDate(now()),overdue:true};

const T0_RULES=[
 {id:'cfa-cap',match:/laspo|cfa.+(cap|success)|success.?fee.+cap/i,answer:()=>`**LASPO 2012 · CFA success-fee cap (PI):**

Under the Legal Aid, Sentencing and Punishment of Offenders Act 2012, **success fees on CFAs are no longer recoverable from the defendant** in most PI work. They come out of the client's damages.

**Caps:**
- **Personal injury** · success fee capped at **25% of damages** (excluding future care/loss)
- The cap applies to general damages + past pecuniary loss only
- Solicitor must explain the fee deduction in the CFA + client retainer

Practical: track success fee as a memo against active CFAs (see *success-fee* tab). Realise on \`case.settled\` (win); reverse on \`case.discontinued\` (lost).

 {id:'dba',match:/dba|damages.based|damages.+based.+agreement/i,answer:()=>`**Damages Based Agreements (DBA Regulations 2013):**

A DBA is a no-win/no-fee arrangement where the lawyer's fee is a **percentage of damages**.

**Caps (post-LASPO):**
- **Personal injury (court proceedings)** · max **${pct(RULES.dbaPiCapPct)}** of damages
- **Employment tribunal** · max 35%
- **All other civil work** · max **${pct(RULES.dbaGeneralCapPct)}** of damages
- Caps are inclusive of counsel fees + VAT

**Hybrid DBAs** are not currently permitted (Lord Justice Jackson reform proposals remain unfinalised).

Disbursements (court fees, ATE, experts) are charged separately on top of the DBA fee in most arrangements.

Your firm: ${state.cases.filter(c=>c.feeArrangement==='dba').length} cases on DBA.`},
 {id:'ate',match:/ate|after.?the.?event|ate.+(insurance|premium|recover)/i,answer:()=>`**ATE (After-The-Event) insurance:**

ATE protects the claimant against adverse costs orders if the claim loses (and against own disbursements depending on policy).

**Recoverability from defendant (post-LASPO 2013):**
- **Generally NOT recoverable** — comes out of damages or is borne by client
- **Exception · clinical negligence** · the *expert report* portion of the ATE premium **remains recoverable** (s.46 LASPO retained this narrow carve-out)
- **Insolvency / publication / privacy** · some legacy recoverability remains

**Premium funding:** usually deferred + contingent (paid only if case wins), but firm carries the disbursement risk if it advances on behalf of client.

Your firm: ${state.atePolicies.length} ATE policies tracked · total premiums ${money(state.atePolicies.reduce((a,p)=>a+(p.premium||0),0))}.`},
 {id:'cmr-fee',match:/cmr.+(fee|annual)|fca.+claims.+fee/i,answer:()=>`**FCA CMR (Claims Management Regulation) annual fee:**

Since April 2019, claims management companies (CMCs) are regulated by the FCA. The annual periodic fee depends on **annual claims-income band**:

- **Small** (<£60k regulated income) · ~${money(RULES.cmrFeeBandSmall)}
- **Medium** (£60k-£500k) · ~${money(RULES.cmrFeeBandMedium)}
- **Large** (£500k+) · ${money(RULES.cmrFeeBandLarge)}+ (banded)
- **Minimum** · ${money(RULES.cmrFeeMinimum)}

Invoices issued **July**, due **end August**. FOS levy invoiced separately. SRA-regulated solicitors handling claims pay SRA practising fees instead.

Your firm: regulation = **${esc((state.settings.firmRegulation||'cmr').toUpperCase())}** · annual estimate ${money(state.settings.cmrAnnualFee||0)} · monthly accrual ${money(cmrMonthlyAccrual())} · next due ${nextCmrFeeDue().next}.`},
 {id:'leadgen',match:/lead.?gen|lead.+generat|referral.+disclos/i,answer:()=>`**Lead-generation fee disclosure (FCA CMR · CMCOB 2.1):**

CMCs **must** disclose to the client at the pre-contract stage:
- Whether the case was generated by a lead generator
- The **amount paid** for the lead, where known
- The identity of the lead generator

This sits under the Conduct of Business Sourcebook for CMCs (CMCOB). Failure to disclose is a regulatory breach + FOS complaint risk.

Solicitor referral fees in PI claims were **banned by LASPO** (s.56) — different regime, more restrictive than CMR. CMR firms are not subject to the s.56 ban but face the FCA disclosure duty.

Track \`referralSource\` + \`referralFee\` on each client (per shared schema). Currently ${state.clients.filter(c=>c.referralFee>0).length} of ${state.clients.length} clients have a recorded referral fee.`},
 {id:'pi-ban',match:/pi.+referral.+ban|referral.+ban|laspo s\.?56/i,answer:()=>`**Personal injury referral fee ban (LASPO s.56):**

Since 1 April 2013, **regulated persons** (solicitors, barristers, claims management companies, alternative business structures) are **prohibited from paying or receiving referral fees** in personal injury claims.

**Scope:**
- Applies to all PI work · RTA, EL, PL, clinical negligence
- "Referral fee" = payment for the *referral of the client*, not legitimate marketing or genuine service charges
- Hospitality / training inducements are caught
- ABS structures + introducer arrangements are heavily scrutinised by the SRA/FCA

**Enforcement:** SRA can fine, suspend, or strike off; FCA can revoke CMR authorisation.

Your firm: ${state.clients.filter(c=>c.referralSource==='lead-generator'||c.referralSource==='introducer').length} clients flagged from lead-gen/introducer · review for s.56 compliance.`},
 {id:'cmr-report',match:/cmr.+(report|return|regdata)|claims.+regdata/i,answer:()=>`**FCA CMR reporting cadence:**

CMR firms report via **FCA RegData** (formerly GABRIEL):
- **CMC001 / CMC002** · half-yearly returns covering claims volumes, complaints, financials
- **Period ends** · typically 30 June + 31 December
- **Submission window** · 30 working days after period end (≈ 42 calendar days)
- **Late penalty** · ${money(RULES.rmarLatePenalty)} fixed, plus reputational mark

Required content:
- Claims received / completed / referred onward
- Lead-gen disclosures count
- Complaints (count + FOS escalations)
- Financial summary (regulated income, fees charged)
- Adviser headcount

The CMR · RegData tab has a "what to gather" checklist + snapshot export. Submission itself remains your responsibility on the FCA portal.`},
 {id:'pii-min',match:/pii|pi insurance|professional indemnit|min.+cover/i,answer:()=>`**Professional Indemnity Insurance (PII) minimum cover:**

- **FCA CMR firms** · MIPRU 3 requires PII as continuing operational condition; minimum cover typically **${money(RULES.piiMinCoverCMR)}** per claim (CMC market standard)
- **SRA-regulated solicitors** · SRA Minimum Terms & Conditions · **${money(RULES.piiMinCoverSRA)}** per claim, unlimited aggregate for non-corporate firms
- Cover from a UK or EEA insurer authorised in general insurance class 13

**Renewal:** annual; SRA firms must have cover in place by **1 October** each year (the "MTC date"). CMR firms renew on policy anniversary.

**Excess:** typically £2.5k-£25k per claim; must be capitalised if above firm's regulatory capital floor.

Your firm: ${esc(state.firm?.piiInsurer||'(insurer not set)')} · policy ${esc(state.firm?.piiPolicyNo||'(none)')} · expires ${state.firm?.piiExpiresAt?isoDate(state.firm.piiExpiresAt):'(not set)'} · monthly accrual ${money(piiMonthlyAccrual())}.
${piiDaysToExpiry()!==null&&piiDaysToExpiry()<RULES.piiAmberDays?'⚠ Renewal due in '+piiDaysToExpiry()+' days — start the broker conversation now.':''}`},
 {id:'fos',match:/complain|fos|ombudsman/i,answer:()=>`**Complaints handling · FCA CMR + SRA + FOS:**

**Internal:**
- FCA DISP requires firms to acknowledge within **5 business days**, resolve within **8 weeks**
- SRA Code of Conduct para 8.2-8.4 mirrors this for solicitors
- Keep a **complaints register** · who, when, nature, resolution, learning

**Final response letter (FRL)** must include:
- Outcome + reasoning
- FOS escalation right (within 6 months)
- FOS reference details

**FOS jurisdiction:**
- Free for consumer · firm pays **case fee** (~£650 per chargeable case beyond first 3 per year for CMR firms)
- FOS award limit · **£430,000** (post-Apr 2024)

Your firm: ${state.complaintsRegister.length} complaints logged · ${state.complaintsRegister.filter(c=>c.fosEscalated).length} escalated to FOS.`},
 {id:'stale-money',match:/stale.+(money|client)|client.+money.+stale|unclaimed/i,answer:()=>`**Stale client money in escrow:**

Money held >12 months with no instruction or contact is "stale":

**SRA Accounts Rules (firms acting as solicitors)** · Rule 5.1(c) · firm must take "reasonable steps" to return; can pay to charity per AR 5.1(d) after exhausting attempts (with SRA notification if >£500 per residual balance).

**Non-SRA firms** · less prescriptive but Consumer Duty + FOS expectations apply; document tracing attempts and final disposition.

**Practical workflow:**
1. Annual stale-money review (escrow tab filter by age)
2. Two written contact attempts via known address
3. If unclaimed: hold + flag, or remit per regulator rules
4. Audit-chain every step

Your firm: ${state.escrow.filter(e=>e.type==='in'&&!e.reconciledAt&&daysBetween(e.ts,now())>365).length} entries aged >12mo without reconciliation.`},
 {id:'vat',match:/vat ?(on|for|exempt)|vatable|claims.+vat/i,answer:()=>`**VAT on claims work (UK):**

- **Standard rated (20%)** · most legal services (solicitor fees, CMC fees, court representation)
- Counsel fees billed onward to client · **standard rated** if firm is the principal; pure disbursement (counsel direct to client) may be outside VAT
- Court fees · **disbursement** outside VAT when properly itemised + client is the principal
- ATE premium · **insurance premium tax**, not VAT; recovered separately

**Client-payable element:** if you VAT-bill a successful CFA claimant, the VAT comes out of damages too — disclose at retainer stage.

**VAT registration:** mandatory once UK taxable turnover hits ${money(RULES.vatRegThreshold)}/yr.

Current quarter VAT collected: ${money(vatTotalQuarter().vat)}. YTD revenue: ${money(ytdFees())}.`},
 {id:'court-fee',match:/court.+fee|issue.+fee|disbursement/i,answer:()=>`**Court fees + disbursements:**

**Court issue fees (PI/civil money claim, 2025-26):**
- Up to £300 · £35
- £300-£500 · £50
- £500-£1k · £70
- £1k-£1.5k · £80
- £1.5k-£3k · £115
- £3k-£5k · £205
- £5k-£10k · £455
- £10k-£200k · **5% of claim** (so £10k claim = £500 · £100k claim = £5,000)
- Above £200k · £10,000 fixed

**Treatment:**
- Pure disbursement when paid to court on client's behalf · **outside VAT** if firm acts as agent
- Track in fee ledger with \`arrangement:'disbursement'\` · charge separately on invoice
- Recover from defendant under CPR 44 if claim succeeds (PI portal fixed costs grid applies for portal claims)

Your firm: ${state.feeRecords.filter(f=>f.arrangement==='disbursement').length} disbursement records · total ${money(state.feeRecords.filter(f=>f.arrangement==='disbursement').reduce((a,f)=>a+(f.net||0),0))}.`},
 {id:'counsel',match:/counsel.+fee|barrister.+fee/i,answer:()=>`**Counsel (barrister) fees:**

Two billing models:
1. **Solicitor as principal** · counsel invoices firm, firm pays + recharges client (often with VAT). Treat as cost of sale; output VAT on the recharge.
2. **Direct access / pure disbursement** · counsel invoices client directly; firm passes the invoice. No VAT recharge by firm.

**Brief fee + refreshers:**
- Brief fee · payment for trial preparation + first day
- Refreshers · per additional trial day
- Conference fees · per hour or fixed
- Opinion fees · fixed for written opinion

**Recovery in CFA context:** if counsel is also on a CFA, success fee on counsel's element is also capped 25% PI under LASPO (counsel and solicitor caps are not aggregated against the client unless agreed).

Track counsel fees as \`arrangement:'disbursement'\` against the case.`},
 {id:'cfa-trans',match:/cfa.+(transitional|pre.?laspo|pre.?2013)/i,answer:()=>`**CFA transitional arrangements (pre-LASPO):**

For CFAs **entered into before 1 April 2013**:
- **Success fee** · still recoverable from the unsuccessful defendant (legacy rule)
- **ATE premium** · still recoverable from defendant (legacy rule)
- Recovery preserved by transitional provisions in s.44(6) + s.46(3) LASPO

These cases are now rare but **mesothelioma claims** and certain ongoing legacy matters may still benefit. Distinct accounting trail required:
- Flag the case with \`feeArrangement:'cfa-pre2013'\` if you maintain one
- Separately invoice the recoverable success fee against the defendant insurer
- Track receipt separately from post-LASPO success fees

Most modern PI books are 100% post-LASPO. Your firm: 0 pre-2013 CFAs flagged currently.`},

async function answerQuestion(q){
 for(const r of T0_RULES){if(r.match.test(q))return{src:'T0 · UK claims rules engine',text:r.answer()}}
 const tier=await Cascade.detectTier();
 if(tier!=='T0'){
 const ctx=`Firm: ${state.firm?.name||'(not set)'} · regulation ${state.settings.firmRegulation} · CMR/FCA ref ${state.firm?.fcaRefNo||'(n/a)'}
Advisers: ${state.advisers.length} · Clients: ${state.clients.length} · Cases: ${state.cases.length}
YTD fees: ${money(ytdFees())} · MTD fees: ${money(mtdFees())} · WIP ${money(wipTotal())}
Client escrow held: ${money(escrowTotalHeld())} · last reconciled ${daysSinceEscrowReconciliation()}d ago
PII expires: ${state.firm?.piiExpiresAt?isoDate(state.firm.piiExpiresAt):'(unset)'}
Active cases: ${state.cases.filter(c=>c.status==='active').length} · settled: ${state.cases.filter(c=>c.status==='settled'||c.status==='won').length}
Complaints register: ${state.complaintsRegister.length}`;
 const sys=`You are FallClaimPractice, a sovereign UK claims-firm accounting tool (CMC + SRA solicitor support). You cover client escrow, CFA/DBA fee tracking, success-fee accruals, ATE insurance, FCA CMR fees + reporting, complaints register, PII. You are NOT a regulatory submission system. Be concrete, cite £, prefer UK terminology + LASPO 2012 / DBA Regs 2013 / FCA CMCOB references. End with 'Verify with your compliance consultant before acting.'

Firm context:
${ctx}`;
 const r=await Cascade.generate(sys,q,1200);
 if(r.text)return{src:r.tier,text:r.text};
 }
 return{src:'T0 · fallback',text:`No rule match. Try: "LASPO CFA success fee cap?", "DBA Regs 2013 caps?", "is ATE recoverable from defendant?", "FCA CMR annual fee?", "lead-gen fee disclosure?", "PI referral fee ban?", "CMR reporting cadence?", "PII minimum cover?", "complaints FOS route?", "stale client money?", "VAT on claims work?", "court fee disbursement?", "counsel fees?", "CFA transitional arrangements?".

Or add an API key in Settings for grounded answers.`};
}

function nextCMRWindow(){
 const d=new Date();const yr=d.getFullYear();
 const jun30=new Date(yr,5,30).getTime();
 const dec31=new Date(yr,11,31).getTime();
 let pEnd;
 if(d.getTime()<=jun30+30*dayMs)pEnd=jun30;
 else if(d.getTime()<=dec31+30*dayMs)pEnd=dec31;
 else pEnd=new Date(yr+1,5,30).getTime();
 const opens=pEnd+dayMs;
 const due=pEnd+42*dayMs;
 return {periodEnd:isoDate(pEnd),opens:isoDate(opens),due:isoDate(due),daysToDue:daysBetween(now(),due)};
}

async function runScheduleCron(){
 let generated=0;
 const today=now();
 for(const s of state.feeSchedules){
 if(!s.active)continue;
 while(s.nextDueAt&&s.nextDueAt<=today){
 const fee={
 id:'fr_'+uid(),caseId:s.caseId||'',clientId:s.clientId,adviserId:s.adviserId,firmId:s.firmId||state.firm?.id||'',
 ts:s.nextDueAt,dateOf:isoDate(s.nextDueAt),
 arrangement:s.arrangement||'fixed',type:'retainer',basis:'flat',hours:0,hourlyRate:0,
 description:(s.description||'Retainer')+' · auto-generated',
 gross:s.amount,vat:0,net:s.amount,
 status:'invoiced',
 invoiceId:'INV-AUTO-'+(state.feeRecords.length+1).toString().padStart(4,'0'),
 realisedAt:null,
 allocations:[{adviserId:s.adviserId,share:1.0}],
 scheduleId:s.id,
 };
 state.feeRecords.push(fee);await idbPut('feeRecords',fee);
 generated++;
 s.nextDueAt=advanceDate(s.nextDueAt,s.frequency);
 }
 await idbPut('feeSchedules',s);
 }
 if(generated){await appendAudit('schedule.cron.generated','Cron generated retainer fees',{count:generated});toast(generated+' retainer fee(s) generated')}
}

function exportCaseSummary(id){
 const cs=state.cases.find(x=>x.id===id);if(!cs)return;
 const cl=state.clients.find(c=>c.id===cs.clientId);
 const adv=state.advisers.find(a=>a.id===cs.responsibleHandlerId);
 const fees=feesForCase(id);
 const wip=fees.filter(f=>f.status==='wip').reduce((a,f)=>a+(f.net||0),0);
 const realised=fees.filter(f=>f.status!=='wip').reduce((a,f)=>a+(f.net||0),0);
 const disb=fees.filter(f=>f.arrangement==='disbursement').reduce((a,f)=>a+(f.net||0),0);
 const escr=escrowForCase(id);
 const escNet=escr.reduce((a,e)=>a+(e.type==='in'?(e.amount||0):e.type==='out'?-(e.amount||0):0),0);
 const ate=state.atePolicies.find(p=>p.caseId===id);
 const md=`# Case summary · ${esc(cs.ref)}

**Client:** ${esc(cl?cl.firstName+' '+cl.lastName:'-')}
**Handler:** ${esc(adv?.name||'-')}
**Type:** ${esc(cs.type)} · protocol ${esc(cs.protocol||'-')}
**Fee arrangement:** ${esc(cs.feeArrangement)}${cs.feeArrangement==='cfa'?' · success '+cs.cfaSuccessFeePct+'% (capped '+pct(RULES.cfaSuccessFeePiCapPct)+' PI)':cs.feeArrangement==='dba'?' · '+cs.dbaPct+'% (capped '+pct(RULES.dbaPiCapPct)+' PI court)':''}
**Status:** ${esc(cs.status)}${cs.settlementAmount?' · settled '+money(cs.settlementAmount):''}

## Valuation
- Special damages: ${money((cs.valuation?.specialDamages||[]).reduce((a,s)=>a+(s.amount||0),0))}
- General damages assessment: ${money(cs.valuation?.generalDamages?.assessment||0)}
- Interest: ${money(cs.valuation?.interest||0)}
- **Total estimate: ${money(cs.valuation?.totalEstimate||0)}**

## Fee position
- WIP (unrealised): **${money(wip)}**
- Realised fees: **${money(realised)}**
- Disbursements: ${money(disb)}
- Live success-fee accrual: ${money(liveAccrualForCase(cs))}

## Escrow (this case)
- Net held: ${money(escNet)}
- Entries: ${escr.length}

## ATE
- ${ate?esc(ate.insurer)+' · premium '+money(ate.premium)+' · cover '+money(ate.coverageAmount):'(no policy)'}

## Timeline
${(cs.timeline||[]).map(t=>`- ${isoDate(t.ts)} · ${esc(t.kind)}: ${esc(t.notes||'')}`).join('\n')||'(no events logged)'}

## Net firm contribution
${money(realised+liveAccrualForCase(cs)-disb)}

---
*Per-case summary · FallClaimPractice v${VERSION}*`;
 downloadFile('case-'+cs.ref+'.md',md,'text/markdown');toast('case summary exported');
}

function openModal(kind){
 const wrap=$('#modal');const titleEl=$('#modalTitle');const body=$('#modalBody');
 if(kind==='settings'){titleEl.textContent='Settings · firm + cascade + audit';body.innerHTML=settingsForm()}
 else if(kind==='newFee'||kind.startsWith('newFeeFor:')){const csId=kind.startsWith('newFeeFor:')?kind.split(':')[1]:'';titleEl.textContent='Record a fee';body.innerHTML=feeForm(null,csId)}
 else if(kind.startsWith('feeDetail:')){const f=state.feeRecords.find(x=>x.id===kind.split(':')[1]);if(!f)return;titleEl.textContent='Fee · '+(f.invoiceId||f.id);body.innerHTML=feeDetail(f)}
 else if(kind==='newCase'||kind.startsWith('newCaseFor:')){const clId=kind.startsWith('newCaseFor:')?kind.split(':')[1]:'';titleEl.textContent='New case';body.innerHTML=caseForm(clId)}
 else if(kind==='newSchedule'){titleEl.textContent='Recurring retainer schedule';body.innerHTML=scheduleForm()}
 else if(kind==='newClient'){titleEl.textContent='New client';body.innerHTML=clientForm()}
 else if(kind==='newAdviser'){titleEl.textContent='New adviser';body.innerHTML=adviserForm()}
 else if(kind==='escrowEntry'||kind.startsWith('escrowFor:')){const csId=kind.startsWith('escrowFor:')?kind.split(':')[1]:'';titleEl.textContent='Escrow entry';body.innerHTML=escrowForm(csId)}
 else if(kind==='newATE'){titleEl.textContent='ATE policy';body.innerHTML=ateForm()}
 else if(kind==='newComplaint'){titleEl.textContent='Complaint';body.innerHTML=complaintForm()}
 else if(kind==='newExpense'){titleEl.textContent='Expense';body.innerHTML=expenseForm()}
 wrap.classList.add('open');
}
function closeModal(){$('#modal').classList.remove('open')}

async function saveFee(){
 let gross=+$('#ffGross').value||0;
 const hours=+$('#ffHours').value||0;
 const rate=+$('#ffRate').value||0;
 if(!gross&&hours&&rate)gross=hours*rate;
 const vat=+$('#ffVat').value||0;
 const csId=$('#ffCs').value;
 const cs=state.cases.find(c=>c.id===csId);
 const f={id:'fr_'+uid(),caseId:csId,clientId:cs?.clientId||'',adviserId:$('#ffAd').value,firmId:state.firm?.id||'',ts:new Date($('#ffDate').value||isoDate(now())).getTime(),dateOf:$('#ffDate').value||isoDate(now()),arrangement:$('#ffArr').value,type:$('#ffType').value,basis:$('#ffBasis').value,hours,hourlyRate:rate,description:$('#ffDesc').value,gross,vat,net:gross-vat,status:$('#ffStatus').value,realisedAt:($('#ffStatus').value==='paid'||$('#ffStatus').value==='realised')?now():null,invoiceId:'INV-'+new Date().getFullYear()+'-'+(state.feeRecords.length+1).toString().padStart(4,'0'),allocations:[{adviserId:$('#ffAd').value,share:1.0}]};
 state.feeRecords.push(f);await idbPut('feeRecords',f);
 await appendAudit('fee.recorded','User recorded fee',{id:f.id,caseId:f.caseId,adviserId:f.adviserId,net:f.net,arrangement:f.arrangement});
 closeModal();toast('fee saved');render();
}

async function seedMonthlyAccruals(){
 const m=monthKey(now());
 const items=[

 {type:'SRA practising fee',amount:Math.round((state.settings.profBodyAnnual||0)/12),notes:'Monthly accrual (auto)'},
 ];

 for(const it of items){

 }

 toast(added+' accruals seeded');render();
}

 else if(m.action==='ask'&&m.question){const a=await answerQuestion(m.question);r={ok:true,answer:a.text,src:a.src}}
 else if(m.action==='ledger')r={ok:true,count:state.feeRecords.length,ytd:ytdFees(),mtd:mtdFees(),wip:wipTotal()};
 else if(m.action==='escrow')r={ok:true,total:escrowTotalHeld(),unreconciled:escrowUnreconciled().length};
 try{e.source&&e.source.postMessage({type:'fall-rpc-r',id:m.id,result:r},'*')}catch(err){}
 }
});

window.FALLCLAIMPRACTICE={
 version:VERSION,prime:PRIME,
 state:()=>state,
 recordFee:async f=>{const fee={id:'fr_'+uid(),ts:now(),dateOf:isoDate(now()),allocations:[],status:'wip',...f};fee.net=(fee.gross||0)-(fee.vat||0);state.feeRecords.push(fee);await idbPut('feeRecords',fee);await appendAudit('fee.recorded.api','API recorded',{id:fee.id});render();return fee},
 recordEscrow:async e=>{const en={id:'es_'+uid(),ts:now(),dateOf:isoDate(now()),...e};state.escrow.push(en);await idbPut('escrow',en);broadcastEscrowEntry(en);render();return en},
 recordComplaint:async c=>{const co={id:'co_'+uid(),ts:now(),dateOf:isoDate(now()),...c};state.complaintsRegister.push(co);await idbPut('complaintsRegister',co);broadcastComplaintRecorded(co);render();return co},
 ytd:ytdFees,mtd:mtdFees,wip:wipTotal,
 escrowHeld:escrowTotalHeld,
 liveAccrual:liveAccrualForCase,
 ask:answerQuestion,
};

(async function boot(){
 try{
 await loadAll();
 await maybeSeedDemo();
 await runScheduleCron();
 setupMesh();
 render();
 updateTierBadge();
 console.log('[fallclaimpractice]','v'+VERSION,'prime',PRIME,'· loaded · clients:',state.clients.length,'cases:',state.cases.length,'fees:',state.feeRecords.length,'escrow:',state.escrow.length);
 }catch(e){console.error('[fallclaimpractice] boot fail',e);$('#view').innerHTML='<div class="disclaimer">Boot failed: '+esc(e.message)+'</div>'}
})();
</script>
